<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Aqua World</title>
<style>
html,body,#app{margin:0;width:100%;height:100%;border:0;background:#fffafd}
body{overflow:hidden}
#app{display:block}
</style>
</head>
<body>
<iframe id="app" src="index.html.html" title="My Aqua World"></iframe>
<script>
const SUPABASE_URL='https://evkpeppqjyxezjystxrs.supabase.co';
const SUPABASE_KEY='sb_publishable_FuOy4rsV0YUVHB7Iv_1zxg_9JHeuYXK';
const BUCKET="aqua-photos";

function safeName(name){
  return (name || "photo").replace(/[^a-zA-Z0-9._-]+/g,"_");
}

async function uploadPhoto(inp){
  const f=inp && inp.files && inp.files[0];
  if(!f) return "";
  if(!f.type || !f.type.startsWith("image/")) throw new Error("Please choose an image file.");

  const ext=(f.name.split(".").pop() || "jpg").toLowerCase();
  const tankId=(document.getElementById("app").contentWindow.db?.activeTankId || "tank").replace(/[^a-zA-Z0-9_-]/g,"_");
  const path=`${tankId}/${Date.now()}_${Math.random().toString(36).slice(2,8)}_${safeName(f.name || ("photo."+ext))}`;
  const objectUrl=`${SUPABASE_URL}/storage/v1/object/${BUCKET}/${path}`;

  const r=await fetch(objectUrl,{
    method:"POST",
    headers:{
      "apikey":SUPABASE_KEY,
      "Authorization":"Bearer "+SUPABASE_KEY,
      "Content-Type":f.type,
      "x-upsert":"false"
    },
    body:f
  });

  if(!r.ok){
    let msg="";
    try{ msg=await r.text(); }catch(e){}
    throw new Error("Photo upload failed ("+r.status+"). "+msg);
  }

  return `${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/${path}`;
}

const frame=document.getElementById("app");
frame.addEventListener("load",()=>{
  const w=frame.contentWindow;
  try{
    w.fileData=uploadPhoto;
    // Re-assign inside the child page as well so existing functions resolve the new uploader.
    const s=w.document.createElement("script");
    s.textContent=`fileData = parent.uploadPhoto;`;
    w.document.body.appendChild(s);
    console.log("My Aqua World: Supabase photo storage enabled.");
  }catch(e){
    console.error("Could not enable Supabase photo storage.",e);
  }
});
</script>
</body>
</html>
